<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sofia Airport Routes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; }
        #map { height: 90vh; width: 100%; }
        #controls {
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f2f2f2;
            gap: 20px;
        }
        select { padding: 5px 10px; font-size: 16px; }
    </style>
</head>
<body>
    <div id="controls">
        <label for="routeSelect">Choose a route to display:</label>
        <select id="routeSelect">
            <option value="0">Route 1 (Red)</option>
            <option value="1">Route 2 (Blue)</option>
            <option value="2">Route 3 (Green)</option>
            <option value="all">Show All</option>
        <label for="roadSelect">Choose a road:</label>
        <select id="roadSelect">
            <option value="airport">vidritsa → Airport</option>
            <option value="northern">Northern Sofia Route</option>
            <option value="southern">Southern Sofia Route</option>
        </select>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <script>
        // Initialize map centered on Sofia
        const map = L.map('map').setView([42.6977, 23.3219], 12);
        // Initialize map
        var map = L.map('map').setView([42.760578653614274, 22.863544551378705], 12);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Define routes with actual points in Sofia (lat, lng)
        const routes = {
            airport: [
                [42.760578653614274, 22.863544551378705],  // Sofia center
                [42.6915, 23.4060]   // Sofia airport approximate
            ],
            northern: [
                [42.7100, 23.3000],
                [42.7300, 23.3500],
                [42.7500, 23.3300]
            ],
            southern: [
                [42.6800, 23.3000],
                [42.6600, 23.3300],
                [42.6500, 23.3100]
            ]
        };
        // Define three routes with one hidden intermediate waypoint each
        const routesData = [
            { color: 'red', waypoints: [
                [42.6977, 23.3219],  // Sofia center
                [42.7000, 23.3400],  // hidden intermediate to force different road
                [42.6915, 23.4060]   // Airport
            ]},
            { color: 'blue', waypoints: [
                [42.6977, 23.3219],
                [42.7100, 23.3600],
                [42.6915, 23.4060]
            ]},
            { color: 'green', waypoints: [
                [42.6977, 23.3219],
                [42.6800, 23.3300],
                [42.6915, 23.4060]
            ]}
        ];

        let routeControls = [];

        function createRouteControl(route) {
            return L.Routing.control({
                waypoints: route.waypoints.map(p => L.latLng(p[0], p[1])),
                lineOptions: { styles: [{ color: route.color, weight: 4 }] },
                routeWhileDragging: false,
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true,
                createMarker: () => null // no visible markers
            });
        }

        // Create all 3 routes
        for (let i = 0; i < routesData.length; i++) {
            routeControls[i] = createRouteControl(routesData[i]);
            routeControls[i].addTo(map);
        }

        // Dropdown selection logic
        const select = document.getElementById('routeSelect');
        select.addEventListener('change', function() {
            const val = this.value;
            for (let i = 0; i < routeControls.length; i++) {
                if (val === 'all' || parseInt(val) === i) {
                    routeControls[i].addTo(map);
                } else {
                    map.removeControl(routeControls[i]);
                }
            }
        });
    </script>
</body>
</html>
