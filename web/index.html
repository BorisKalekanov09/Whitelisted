<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sofia Roads Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #map { height: 90vh; width: 100%; }
        #controls {
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f2f2f2;
            gap: 20px;
        }
        select { padding: 5px 10px; font-size: 16px; }
    </style>
</head>
<body>
    <div id="controls">
        <label for="roadSelect">Choose a road:</label>
        <select id="roadSelect">
            <option value="airport">vidritsa → Airport</option>
            <option value="northern">Northern Sofia Route</option>
            <option value="southern">Southern Sofia Route</option>
        </select>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <script>
        // Initialize map
        var map = L.map('map').setView([42.760247343701906, 22.86364124855089], 12);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Define routes with actual points in Sofia (lat, lng)
        const routes = {
            airport: [
                [42.760247343701906, 22.86364124855089],  // vidritsa
                [42.6915, 23.4060]   // Sofia airport approximate
            ],
            northern: [
                [42.7100, 23.3000],
                [42.7300, 23.3500],
                [42.7500, 23.3300]
            ],
            southern: [
                [42.6800, 23.3000],
                [42.6600, 23.3300],
                [42.6500, 23.3100]
            ]
        };

        let currentControl = null;

        function drawRoute(routeName) {
            if (currentControl) {
                map.removeControl(currentControl);
            }

            currentControl = L.Routing.control({
                waypoints: routes[routeName].map(coord => L.latLng(coord[0], coord[1])),
                lineOptions: {
                    styles: [{ color: 'red', weight: 4 }]
                },
                routeWhileDragging: false,
                draggableWaypoints: false,
                addWaypoints: false,
                fitSelectedRoutes: true
            }).addTo(map);
        }

        // Initial route
        drawRoute('airport');

        // Dropdown change
        document.getElementById('roadSelect').addEventListener('change', function() {
            drawRoute(this.value);
        });
    </script>
</body>
</html>
